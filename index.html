<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FitZone Bespoke Customizer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-[#080C14] text-slate-100 min-h-screen flex flex-col justify-between select-none pb-28">

  <!-- Header -->
  <header class="p-4 border-b border-slate-800 bg-[#0D1527] sticky top-0 z-30 shadow-lg">
    <h1 class="text-xs font-bold tracking-widest text-[#D4AF37] uppercase">
      FitZone Atelier — Bespoke Shirt
    </h1>
    <div class="flex gap-6 mt-3 text-xs">
      <button id="tab-fabric" onclick="switchStep('FABRIC')" class="pb-1 text-[#D4AF37] border-b-2 border-[#D4AF37] font-bold">
        1. SELECT FABRIC
      </button>
      <button id="tab-design" onclick="switchStep('DESIGN')" class="pb-1 text-slate-400">
        2. CUSTOMIZE LOOK
      </button>
    </div>
  </header>

  <!-- Main Container -->
  <main class="p-4 max-w-md mx-auto w-full flex-1">
    
    <!-- STEP 1: FABRICS -->
    <div id="step-fabric" class="space-y-4">
      <!-- Material Filter Tabs -->
      <div class="flex gap-2 overflow-x-auto pb-1 no-scrollbar" id="filter-tabs">
        <button onclick="filterFabrics('All', this)" class="px-3.5 py-1.5 rounded-full text-xs font-bold whitespace-nowrap bg-[#D4AF37] text-black filter-btn">All</button>
        <button onclick="filterFabrics('Cotton', this)" class="px-3.5 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap bg-slate-800 text-slate-300 filter-btn">Cotton</button>
        <button onclick="filterFabrics('Linen', this)" class="px-3.5 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap bg-slate-800 text-slate-300 filter-btn">Linen</button>
        <button onclick="filterFabrics('Silk', this)" class="px-3.5 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap bg-slate-800 text-slate-300 filter-btn">Silk</button>
        <button onclick="filterFabrics('Suiting', this)" class="px-3.5 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap bg-slate-800 text-slate-300 filter-btn">Suiting</button>
      </div>

      <!-- Fabrics Swatch Grid -->
      <div id="fabric-grid" class="grid grid-cols-2 gap-3.5 pt-2">
        <div class="col-span-2 text-center py-10 text-[#D4AF37] text-xs font-semibold">
          Fetching 86 Bespoke Fabrics...
        </div>
      </div>
    </div>

    <!-- STEP 2: DESIGN CUSTOMIZER -->
    <div id="step-design" class="hidden space-y-6">
      <div id="design-container" class="space-y-5">
        <!-- Dynamic Collar/Cuff/Pocket options injected here -->
      </div>
    </div>

  </main>

  <!-- Sticky Bottom Pricing Bar -->
  <footer class="fixed bottom-0 left-0 right-0 p-4 bg-[#0D1527] border-t border-slate-800 flex items-center justify-between z-30 shadow-2xl">
    <div>
      <span class="text-[10px] text-slate-400 block uppercase tracking-wider">Total Investment</span>
      <p id="grand-total" class="text-lg font-black text-[#D4AF37]">₹1200</p>
    </div>
    <button id="next-btn" onclick="handleNextStep()" class="px-6 py-2.5 bg-[#D4AF37] text-black font-bold text-xs rounded-xl shadow-lg shadow-[#D4AF37]/25 active:scale-95 transition-transform">
      Next: Customize →
    </button>
  </footer>

  <script>
    const SUPABASE_URL = "https://kghboylsqrdugmmlnnnd.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtnaGJveWxzcXJkdWdtbWxubm5kIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDAxNzc1NTQsImV4cCI6MjA1NTc1MzU1NH0.FzFpB7y2XwP6-2wV_0PqvZ2vT8-J-fLzN_8yA4K8E0g";
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let state = {
      step: 'FABRIC',
      fabrics: [],
      filteredFabrics: [],
      selectedFabric: null,
      options: [],
      selectedOptions: {},
      basePrice: 1200,
      reqMeters: 1.6
    };

    async function initApp() {
      try {
        // Fetch Fabrics
        const { data: fabData, error: fErr } = await db.from('fabrics').select('*');
        if (fabData && fabData.length > 0) {
          state.fabrics = fabData;
          state.filteredFabrics = fabData;
          state.selectedFabric = fabData[0];
          renderFabrics();
        }

        // Fetch Design Options
        const { data: optData } = await db.from('design_options').select('*, design_option_values(*)');
        if (optData && optData.length > 0) {
          state.options = optData;
          optData.forEach(opt => {
            if (opt.design_option_values && opt.design_option_values.length > 0) {
              state.selectedOptions[opt.option_type] = opt.design_option_values[0];
            }
          });
          renderDesigns();
        }

        calculateTotal();
      } catch (err) {
        console.error("Initialization error:", err);
      }
    }

    function renderFabrics() {
      const grid = document.getElementById('fabric-grid');
      grid.innerHTML = '';

      state.filteredFabrics.forEach(fabric => {
        const isSelected = state.selectedFabric?.fabric_id === fabric.fabric_id;
        const card = document.createElement('div');
        card.className = `p-3.5 rounded-2xl border cursor-pointer transition-all flex flex-col justify-between min-h-[140px] ${
          isSelected
            ? 'border-[#D4AF37] bg-[#162038] ring-2 ring-[#D4AF37]/50 scale-[1.02] shadow-lg shadow-[#D4AF37]/20'
            : 'border-slate-800 bg-[#0D1527] hover:border-slate-700'
        }`;
        
        card.onclick = () => {
          state.selectedFabric = fabric;
          renderFabrics();
          calculateTotal();
        };

        card.innerHTML = `
          <div class="w-full h-12 rounded-xl bg-slate-900 border border-slate-800 flex items-center justify-center p-2 text-center">
            <span class="text-[10px] font-bold text-[#D4AF37] uppercase tracking-wider truncate">${fabric.fabric_sku || 'FZ-FAB'}</span>
          </div>
          <div class="mt-2.5">
            <p class="text-xs font-bold text-white truncate">${fabric.fabric_name}</p>
            <p class="text-[10px] text-slate-400 truncate mt-0.5">${fabric.material_type || 'Bespoke'}</p>
            <p class="text-xs font-bold text-[#D4AF37] mt-1.5">₹${fabric.price_per_meter} <span class="text-[9px] font-normal text-slate-400">/meter</span></p>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function renderDesigns() {
      const container = document.getElementById('design-container');
      container.innerHTML = '';

      state.options.forEach(opt => {
        const selectedVal = state.selectedOptions[opt.option_type];
        const section = document.createElement('div');
        section.className = 'space-y-2.5';

        let buttonsHTML = '';
        opt.design_option_values.forEach(val => {
          const isSelected = selectedVal?.option_value_id === val.option_value_id;
          buttonsHTML += `
            <button onclick="selectOption('${opt.option_type}', '${val.option_value_id}')" class="p-3 rounded-xl border text-left transition-all ${
              isSelected ? 'border-[#D4AF37] bg-[#162038] ring-1 ring-[#D4AF37] text-white' : 'border-slate-800 bg-[#0D1527] text-slate-300'
            }">
              <p class="text-xs font-semibold truncate">${val.value_name}</p>
              <p class="text-[10px] text-[#D4AF37] font-medium mt-1">${Number(val.additional_price) > 0 ? '+₹' + val.additional_price : 'Included'}</p>
            </button>
          `;
        });

        section.innerHTML = `
          <div class="flex justify-between items-center text-xs">
            <span class="font-bold text-slate-300 uppercase tracking-wider">${opt.option_name}</span>
            <span class="text-[#D4AF37] font-semibold">${selectedVal?.value_name || ''}</span>
          </div>
          <div class="grid grid-cols-2 gap-2.5">
            ${buttonsHTML}
          </div>
        `;
        container.appendChild(section);
      });
    }

    function selectOption(optionType, valueId) {
      const optGroup = state.options.find(o => o.option_type === optionType);
      const val = optGroup.design_option_values.find(v => v.option_value_id === valueId);
      state.selectedOptions[optionType] = val;
      renderDesigns();
      calculateTotal();
    }

    function filterFabrics(type, btn) {
      document.querySelectorAll('.filter-btn').forEach(b => {
        b.className = 'px-3.5 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap bg-slate-800 text-slate-300 filter-btn';
      });
      btn.className = 'px-3.5 py-1.5 rounded-full text-xs font-bold whitespace-nowrap bg-[#D4AF37] text-black filter-btn';

      if (type === 'All') {
        state.filteredFabrics = state.fabrics;
      } else {
        state.filteredFabrics = state.fabrics.filter(f => 
          (f.material_type || '').toLowerCase().includes(type.toLowerCase()) || 
          (f.fabric_name || '').toLowerCase().includes(type.toLowerCase())
        );
      }
      renderFabrics();
    }

    function calculateTotal() {
      const fabricCost = state.selectedFabric ? (Number(state.selectedFabric.price_per_meter) || 0) * state.reqMeters : 0;
      const designUpcharge = Object.values(state.selectedOptions).reduce((sum, item) => sum + (Number(item?.additional_price) || 0), 0);
      const total = Math.round(state.basePrice + fabricCost + designUpcharge);
      document.getElementById('grand-total').innerText = '₹' + total;
      return total;
    }

    function switchStep(stepName) {
      state.step = stepName;
      const fabricStep = document.getElementById('step-fabric');
      const designStep = document.getElementById('step-design');
      const tabFabric = document.getElementById('tab-fabric');
      const tabDesign = document.getElementById('tab-design');
      const nextBtn = document.getElementById('next-btn');

      if (stepName === 'FABRIC') {
        fabricStep.classList.remove('hidden');
        designStep.classList.add('hidden');
        tabFabric.className = 'pb-1 text-[#D4AF37] border-b-2 border-[#D4AF37] font-bold';
        tabDesign.className = 'pb-1 text-slate-400';
        nextBtn.innerText = 'Next: Customize →';
      } else {
        fabricStep.classList.add('hidden');
        designStep.classList.remove('hidden');
        tabDesign.className = 'pb-1 text-[#D4AF37] border-b-2 border-[#D4AF37] font-bold';
        tabFabric.className = 'pb-1 text-slate-400';
        nextBtn.innerText = 'Next: Measurements →';
      }
    }

    function handleNextStep() {
      if (state.step === 'FABRIC') {
        switchStep('DESIGN');
      } else {
        const total = calculateTotal();
        alert('Selection Saved! Total: ₹' + total + '\nReady for Measurement Capture.');
      }
    }

    // Initialize on load
    window.onload = initApp;
  </script>
</body>
</html>
