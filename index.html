<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FitZone Bespoke Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-[#080C14] text-slate-100 min-h-screen flex flex-col justify-between select-none pb-28">

  <!-- Header -->
  <header class="p-4 border-b border-slate-800 bg-[#0D1527] sticky top-0 z-30 shadow-lg">
    <div class="flex justify-between items-center">
      <h1 class="text-xs font-bold tracking-widest text-[#D4AF37] uppercase">
        FitZone Atelier — Bespoke Studio
      </h1>
      <span id="step-indicator" class="text-[10px] bg-[#162038] text-[#D4AF37] border border-[#D4AF37]/40 px-2 py-0.5 rounded-full font-semibold">
        Step 1/3
      </span>
    </div>
    
    <!-- Flow Tabs -->
    <div class="flex gap-4 mt-3 text-xs overflow-x-auto no-scrollbar">
      <button id="tab-fabric" onclick="goToStep('FABRIC')" class="pb-1 text-[#D4AF37] border-b-2 border-[#D4AF37] font-bold whitespace-nowrap">
        1. FABRIC
      </button>
      <button id="tab-design" onclick="goToStep('DESIGN')" class="pb-1 text-slate-400 whitespace-nowrap">
        2. CUSTOMIZE
      </button>
      <button id="tab-measure" onclick="goToStep('MEASURE')" class="pb-1 text-slate-400 whitespace-nowrap">
        3. MEASUREMENTS
      </button>
    </div>
  </header>

  <!-- Main Workflows -->
  <main class="p-4 max-w-md mx-auto w-full flex-1">
    
    <!-- STEP 1: FABRICS -->
    <div id="step-fabric" class="space-y-4">
      <div class="flex gap-2 overflow-x-auto pb-1 no-scrollbar">
        <button onclick="filterFabrics('All', this)" class="px-3.5 py-1.5 rounded-full text-xs font-bold whitespace-nowrap bg-[#D4AF37] text-black filter-btn">All</button>
        <button onclick="filterFabrics('Cotton', this)" class="px-3.5 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap bg-slate-800 text-slate-300 filter-btn">Cotton</button>
        <button onclick="filterFabrics('Linen', this)" class="px-3.5 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap bg-slate-800 text-slate-300 filter-btn">Linen</button>
        <button onclick="filterFabrics('Silk', this)" class="px-3.5 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap bg-slate-800 text-slate-300 filter-btn">Silk</button>
      </div>
      <div id="fabric-grid" class="grid grid-cols-2 gap-3 pt-1"></div>
    </div>

    <!-- STEP 2: DESIGN CUSTOMIZER -->
    <div id="step-design" class="hidden space-y-5">
      <div id="design-container" class="space-y-4"></div>
    </div>

    <!-- STEP 3: MEASUREMENT & CHECKOUT -->
    <div id="step-measure" class="hidden space-y-4">
      <div class="bg-[#0D1527] p-4 rounded-2xl border border-slate-800 space-y-3">
        <h3 class="text-xs font-bold text-[#D4AF37] uppercase tracking-wider">Customer & Fit Profile</h3>
        <input id="cust-name" type="text" placeholder="Full Name" class="w-full bg-[#080C14] border border-slate-700 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-[#D4AF37]">
        <input id="cust-phone" type="tel" placeholder="Mobile Number" class="w-full bg-[#080C14] border border-slate-700 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-[#D4AF37]">
      </div>

      <div class="bg-[#0D1527] p-4 rounded-2xl border border-slate-800 space-y-3">
        <h3 class="text-xs font-bold text-[#D4AF37] uppercase tracking-wider">Shirt Measurements (Inches)</h3>
        <div class="grid grid-cols-2 gap-2.5">
          <div>
            <label class="text-[10px] text-slate-400">Chest</label>
            <input id="m-chest" type="number" value="40" class="w-full bg-[#080C14] border border-slate-700 rounded-xl p-2.5 text-xs text-white">
          </div>
          <div>
            <label class="text-[10px] text-slate-400">Waist</label>
            <input id="m-waist" type="number" value="36" class="w-full bg-[#080C14] border border-slate-700 rounded-xl p-2.5 text-xs text-white">
          </div>
          <div>
            <label class="text-[10px] text-slate-400">Shoulder</label>
            <input id="m-shoulder" type="number" value="18" class="w-full bg-[#080C14] border border-slate-700 rounded-xl p-2.5 text-xs text-white">
          </div>
          <div>
            <label class="text-[10px] text-slate-400">Shirt Length</label>
            <input id="m-length" type="number" value="29" class="w-full bg-[#080C14] border border-slate-700 rounded-xl p-2.5 text-xs text-white">
          </div>
        </div>
      </div>
    </div>

    <!-- ORDER SUCCESS MODAL -->
    <div id="step-success" class="hidden text-center py-12 space-y-4">
      <div class="w-16 h-16 bg-[#D4AF37]/20 border border-[#D4AF37] rounded-full flex items-center justify-center mx-auto text-[#D4AF37] text-2xl font-bold">✓</div>
      <h2 class="text-base font-bold text-white uppercase">Order Confirmed!</h2>
      <p id="order-id-display" class="text-xs text-slate-400"></p>
      <div class="p-4 bg-[#0D1527] border border-slate-800 rounded-2xl text-left text-xs space-y-2 max-w-xs mx-auto">
        <p class="text-slate-300">Status: <span class="text-[#D4AF37] font-semibold">Allocated to Tailor</span></p>
        <p class="text-slate-300">Fabric: <span id="summary-fab" class="text-white"></span></p>
        <p class="text-slate-300">Total Paid: <span id="summary-price" class="text-[#D4AF37] font-bold"></span></p>
      </div>
      <button onclick="location.reload()" class="px-6 py-2.5 bg-slate-800 text-white rounded-xl text-xs font-semibold">Start New Customization</button>
    </div>

  </main>

  <!-- Sticky Footer -->
  <footer id="main-footer" class="fixed bottom-0 left-0 right-0 p-4 bg-[#0D1527] border-t border-slate-800 flex items-center justify-between z-30 shadow-2xl">
    <div>
      <span class="text-[10px] text-slate-400 block uppercase tracking-wider">Total Investment</span>
      <p id="grand-total" class="text-lg font-black text-[#D4AF37]">₹1200</p>
    </div>
    <button id="next-btn" onclick="handleFlowNext()" class="px-6 py-2.5 bg-[#D4AF37] text-black font-bold text-xs rounded-xl shadow-lg shadow-[#D4AF37]/25 active:scale-95 transition-transform">
      Next: Customize →
    </button>
  </footer>

  <script>
    const SUPABASE_URL = "https://kghboylsqrdugmmlnnnd.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtnaGJveWxzcXJkdWdtbWxubm5kIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDAxNzc1NTQsImV4cCI6MjA1NTc1MzU1NH0.FzFpB7y2XwP6-2wV_0PqvZ2vT8-J-fLzN_8yA4K8E0g";
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Initial Live Fabrics Seed
    const defaultFabrics = [
      { fabric_id: '1', fabric_sku: 'FZ-FAB-001', fabric_name: 'Classic Egyptian Cotton', material_type: 'Cotton', price_per_meter: 850 },
      { fabric_id: '2', fabric_sku: 'FZ-FAB-002', fabric_name: 'Sea Island Crisp Cotton', material_type: 'Cotton', price_per_meter: 1100 },
      { fabric_id: '3', fabric_sku: 'FZ-FAB-003', fabric_name: 'Pure Mulberry Silk Blend', material_type: 'Silk', price_per_meter: 1850 },
      { fabric_id: '4', fabric_sku: 'FZ-FAB-004', fabric_name: 'Irish Pure Linen', material_type: 'Linen', price_per_meter: 1450 },
      { fabric_id: '5', fabric_sku: 'FZ-FAB-005', fabric_name: 'Royal Oxford Suiting', material_type: 'Cotton', price_per_meter: 950 },
      { fabric_id: '6', fabric_sku: 'FZ-FAB-006', fabric_name: 'Bespoke Satin Weave', material_type: 'Silk', price_per_meter: 1600 }
    ];

    const defaultOptions = [
      {
        option_name: 'Collar Style',
        option_type: 'COLLAR',
        values: [
          { name: 'Cutaway Collar', price: 0 },
          { name: 'Button-Down Collar', price: 0 },
          { name: 'Bandhgala / Mandarin', price: 150 }
        ]
      },
      {
        option_name: 'Cuff Type',
        option_type: 'CUFF',
        values: [
          { name: 'Single Button Round', price: 0 },
          { name: 'French Cuff (Cufflink)', price: 200 }
        ]
      },
      {
        option_name: 'Front Placket',
        option_type: 'PLACKET',
        values: [
          { name: 'Standard French Front', price: 0 },
          { name: 'Concealed Tuxedo Placket', price: 250 }
        ]
      }
    ];

    let currentStep = 'FABRIC';
    let fabrics = [...defaultFabrics];
    let filteredFabrics = [...defaultFabrics];
    let selectedFabric = defaultFabrics[0];
    let selectedDesigns = {
      COLLAR: defaultOptions[0].values[0],
      CUFF: defaultOptions[1].values[0],
      PLACKET: defaultOptions[2].values[0]
    };
    const baseStitching = 1200;
    const reqMeters = 1.6;

    async function init() {
      renderFabrics();
      renderDesigns();
      calculateTotal();

      // Async Supabase Sync
      try {
        const { data } = await db.from('fabrics').select('*').limit(30);
        if (data && data.length > 0) {
          fabrics = data;
          filteredFabrics = data;
          selectedFabric = data[0];
          renderFabrics();
          calculateTotal();
        }
      } catch(e) {}
    }

    function renderFabrics() {
      const grid = document.getElementById('fabric-grid');
      grid.innerHTML = '';
      filteredFabrics.forEach(f => {
        const isSel = selectedFabric.fabric_id === f.fabric_id;
        const card = document.createElement('div');
        card.className = `p-3 rounded-2xl border cursor-pointer transition-all flex flex-col justify-between ${
          isSel ? 'border-[#D4AF37] bg-[#162038] ring-2 ring-[#D4AF37]/50 shadow-lg' : 'border-slate-800 bg-[#0D1527]'
        }`;
        card.onclick = () => {
          selectedFabric = f;
          renderFabrics();
          calculateTotal();
        };
        card.innerHTML = `
          <div class="h-12 bg-slate-900 border border-slate-800 rounded-xl flex items-center justify-center">
            <span class="text-[10px] font-bold text-[#D4AF37] tracking-wider">${f.fabric_sku}</span>
          </div>
          <div class="mt-2">
            <p class="text-xs font-bold text-white truncate">${f.fabric_name}</p>
            <p class="text-[10px] text-slate-400">${f.material_type}</p>
            <p class="text-xs font-bold text-[#D4AF37] mt-1">₹${f.price_per_meter}/m</p>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function renderDesigns() {
      const container = document.getElementById('design-container');
      container.innerHTML = '';
      defaultOptions.forEach(opt => {
        const div = document.createElement('div');
        div.className = 'space-y-2';
        let btns = '';
        opt.values.forEach(v => {
          const isSel = selectedDesigns[opt.option_type].name === v.name;
          btns += `
            <button onclick="setDesign('${opt.option_type}', '${v.name}', ${v.price})" class="p-3 rounded-xl border text-left text-xs ${
              isSel ? 'border-[#D4AF37] bg-[#162038] text-white ring-1 ring-[#D4AF37]' : 'border-slate-800 bg-[#0D1527] text-slate-300'
            }">
              <p class="font-semibold truncate">${v.name}</p>
              <p class="text-[10px] text-[#D4AF37] mt-0.5">${v.price > 0 ? '+₹' + v.price : 'Included'}</p>
            </button>
          `;
        });
        div.innerHTML = `
          <div class="flex justify-between text-xs font-bold">
            <span class="text-slate-300 uppercase">${opt.option_name}</span>
            <span class="text-[#D4AF37]">${selectedDesigns[opt.option_type].name}</span>
          </div>
          <div class="grid grid-cols-2 gap-2">${btns}</div>
        `;
        container.appendChild(div);
      });
    }

    function setDesign(type, name, price) {
      selectedDesigns[type] = { name, price };
      renderDesigns();
      calculateTotal();
    }

    function filterFabrics(mat, btn) {
      document.querySelectorAll('.filter-btn').forEach(b => b.className = 'px-3.5 py-1.5 rounded-full text-xs font-semibold bg-slate-800 text-slate-300 filter-btn');
      btn.className = 'px-3.5 py-1.5 rounded-full text-xs font-bold bg-[#D4AF37] text-black filter-btn';
      filteredFabrics = mat === 'All' ? fabrics : fabrics.filter(f => f.material_type === mat);
      renderFabrics();
    }

    function calculateTotal() {
      const fabCost = Number(selectedFabric.price_per_meter) * reqMeters;
      const designCost = Object.values(selectedDesigns).reduce((acc, v) => acc + v.price, 0);
      const total = Math.round(baseStitching + fabCost + designCost);
      document.getElementById('grand-total').innerText = '₹' + total;
      return total;
    }

    function goToStep(s) {
      currentStep = s;
      document.getElementById('step-fabric').classList.toggle('hidden', s !== 'FABRIC');
      document.getElementById('step-design').classList.toggle('hidden', s !== 'DESIGN');
      document.getElementById('step-measure').classList.toggle('hidden', s !== 'MEASURE');
      
      document.getElementById('tab-fabric').className = `pb-1 whitespace-nowrap ${s === 'FABRIC' ? 'text-[#D4AF37] border-b-2 border-[#D4AF37] font-bold' : 'text-slate-400'}`;
      document.getElementById('tab-design').className = `pb-1 whitespace-nowrap ${s === 'DESIGN' ? 'text-[#D4AF37] border-b-2 border-[#D4AF37] font-bold' : 'text-slate-400'}`;
      document.getElementById('tab-measure').className = `pb-1 whitespace-nowrap ${s === 'MEASURE' ? 'text-[#D4AF37] border-b-2 border-[#D4AF37] font-bold' : 'text-slate-400'}`;

      const btn = document.getElementById('next-btn');
      const ind = document.getElementById('step-indicator');
      if (s === 'FABRIC') { btn.innerText = 'Next: Customize →'; ind.innerText = 'Step 1/3'; }
      else if (s === 'DESIGN') { btn.innerText = 'Next: Measurements →'; ind.innerText = 'Step 2/3'; }
      else if (s === 'MEASURE') { btn.innerText = 'Confirm & Place Order ➔'; ind.innerText = 'Step 3/3'; }
    }

    function handleFlowNext() {
      if (currentStep === 'FABRIC') goToStep('DESIGN');
      else if (currentStep === 'DESIGN') goToStep('MEASURE');
      else if (currentStep === 'MEASURE') placeFinalOrder();
    }

    async function placeFinalOrder() {
      const name = document.getElementById('cust-name').value.trim();
      const phone = document.getElementById('cust-phone').value.trim();
      if (!name || !phone) {
        alert('Please enter your Name and Mobile Number.');
        return;
      }

      const total = calculateTotal();
      const orderRef = 'FZ-ORD-' + Math.floor(100000 + Math.random() * 900000);

      // Async order insertion in Supabase
      try {
        await db.from('orders').insert([{
          order_number: orderRef,
          total_amount: total,
          order_status: 'PENDING_CONFIRMATION'
        }]);
      } catch(e){}

      // Show UI Success
      document.getElementById('step-measure').classList.add('hidden');
      document.getElementById('main-footer').classList.add('hidden');
      document.getElementById('tab-fabric').parentElement.classList.add('hidden');
      document.getElementById('step-success').classList.remove('hidden');

      document.getElementById('order-id-display').innerText = 'Order Reference: ' + orderRef;
      document.getElementById('summary-fab').innerText = selectedFabric.fabric_name;
      document.getElementById('summary-price').innerText = '₹' + total;
    }

    window.onload = init;
  </script>
</body>
</html>
